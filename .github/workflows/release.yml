# Release (README "Versioning and releases"): a pushed tag vx.y.z — created by `just release
# x.y.z` — builds the solution package and publishes it as a GitHub release. Started by hand
# (workflow_dispatch) it is always a dry run, on a branch or a tag: everything but the publishing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A release run is never cancelled halfway
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Read access only: `npm ci` runs the install scripts of dependencies, so this job never holds a
  # token that may publish
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # The whole history, so the tagged commit can be checked against origin/main
          fetch-depth: 0
      # No tool cache: other jobs on main save it after running dependency install scripts, so the
      # release installs its tools fresh, checked against the checksums in mise.lock
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: false
      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check that the tag matches the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match the version $VERSION in package.json"
            exit 1
          fi
      # A release is only ever published from main (audit M18): a tag pushed while main was
      # rejected, or set on another branch, stops here
      - name: Check that the tagged commit is on main
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $TAG points to a commit that is not on main — push main and the tag together (git push --atomic)"
            exit 1
          fi
      - run: just setup
      - run: just check
      - run: just build
      - name: Collect the package, its checksum, the notices and the release notes
        env:
          # A tag publishes its own CHANGELOG section; the dry run shows the unreleased changes
          NOTES_FOR: ${{ github.ref_type == 'tag' && steps.version.outputs.version || 'Unreleased' }}
          RELEASE_FILES: ${{ runner.temp }}/release-files
        run: |
          mkdir -p "$RELEASE_FILES"
          cp sharepoint/solution/spfx-procview.sppkg THIRD-PARTY-NOTICES.md "$RELEASE_FILES/"
          (cd "$RELEASE_FILES" && sha256sum spfx-procview.sppkg > spfx-procview.sppkg.sha256)
          node scripts/release.mjs --notes "$NOTES_FOR" > "$RELEASE_FILES/release-notes.md"
          {
            echo
            echo "---"
            echo
            echo "Installation, updates and checksum verification: [docs/deployment.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/deployment.md)"
          } >> "$RELEASE_FILES/release-notes.md"
          cat "$RELEASE_FILES/spfx-procview.sppkg.sha256" "$RELEASE_FILES/release-notes.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files/
          if-no-files-found: error
          retention-days: 7

  # The only job that may write: it publishes what `build` produced and runs no project code. Only
  # for a pushed tag — a run started by hand on a tag stays a dry run
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release-files
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "spfx-procview $VERSION" \
            --notes-file release-files/release-notes.md \
            release-files/spfx-procview.sppkg \
            release-files/spfx-procview.sppkg.sha256 \
            release-files/THIRD-PARTY-NOTICES.md
