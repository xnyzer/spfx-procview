# Toolchain pins — fuzzy majors here, exact versions in mise.lock (generated by
# `mise install`, committed). The stack module adds its runtimes to [tools].
[tools]
just = "1"
lefthook = "2"
gitleaks = "8"
# SPFx 1.23 requires Node >=22.14 <23 — bump only together with an SPFx upgrade
node = "22"

[settings]
lockfile = true
